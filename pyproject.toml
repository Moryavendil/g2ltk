[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "g2ltk"
dynamic = ["version"]
authors = [
  { name="G2L", email="GDoubleL@proton.me" },
]
description = "Useful scripts."
readme = "README.md"
requires-python = ">=3.9" # builtin generics in annotations (tuple[int], list[...]), contourpy >= 1.2
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
keywords = [
"image", "analysis", "measure"
]
dependencies = [
    "contourpy >= 1.2", # convert_filled, for 2D fft contours
    "scipy >= 1.7",
    "scikit-image", # for 2D fft windowing
    "shapely >= 2.0", # from_ragged_array, for 2D fft contours
    "numpy >= 1.23.3", # np.ndarray[...] in type aliases and annotations, evaluated when g2ltk.fourier is imported
    "findiff >= 0.12", # Diff with periodic boundaries, for finite differences
]

[project.optional-dependencies]
# g2ltk.plotting
plot = [
    "matplotlib",
    "ipython", # plotting.voila
]
# g2ltk.videoreading
video = [
    "opencv-python-headless", # mp4, mov and mkv videos
    "pillow", # tiff metadata
    "pandas", # datasheets
    "openpyxl", # datasheets (reading and writing xlsx workbooks with pandas)
    "imagecodecs", # reading tiff (t8 / t16) videos
]
full = ["g2ltk[plot,video]"]

[tool.hatch.version]
path = "src/g2ltk/__init__.py"

[project.scripts]
pytojupy = "g2ltk.scripts:pytojupy"
jupytopy = "g2ltk.scripts:jupytopy"

[project.urls]
Homepage = "https://github.com/Moryavendil/g2ltk"
Issues = "https://github.com/Moryavendil/g2ltk/issues"

#[tool.hatch.build.targets.wheel]
#packages = ["g2ltk"]  # when there is no src directory the `include` option is equivalent here
#
